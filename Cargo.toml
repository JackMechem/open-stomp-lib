[workspace]
resolver = "3"
members = [".", "bindings/python"]
# the Python extension is built with maturin (bindings/python/pyproject.toml), not plain cargo
default-members = ["."]

[workspace.package]
# one version for the crate and the Python package
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JackMechem/open-stomp-lib"

[package]
name = "open-stomp"
description = "Library for the SORAN Dual Stomp guitar pedal: USB-MIDI protocol encode/decode, state tracking and a device connection engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["midi", "guitar", "pedal", "sysex", "soran"]
categories = ["multimedia::audio", "hardware-support", "parser-implementations"]
include = ["src/", "examples/", "tests/", "docs/", "captures/logs/", "README.md", "CHANGELOG.md"]

[lib]
name = "open_stomp"

[features]
default = ["device", "nam"]
# MIDI I/O: port discovery, auto-connect, handshake, request pacing, capture replay (midir).
# Without it the crate is pure encode/decode with no dependencies.
device = ["dep:midir", "dep:core-foundation-sys"]
# Neural Amp Modeler: load .nam files and run them (needed to convert NAM models for the pedal).
nam = ["dep:serde_json", "dep:rustfft"]

[dependencies]
midir = { version = "0.11", optional = true }
serde_json = { version = "1", optional = true }
rustfft = { version = "6", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# pump the engine thread's run loop so CoreMIDI can deliver device add/remove notifications
core-foundation-sys = { version = "0.8", optional = true }

[[example]]
name = "monitor"
required-features = ["device"]

[[example]]
name = "ports"
required-features = ["device"]

[[example]]
name = "nam_convert"
required-features = ["nam"]

[[example]]
name = "nam_check"
required-features = ["nam"]

[[example]]
name = "nam_render"
required-features = ["nam"]

[package.metadata.docs.rs]
all-features = true
