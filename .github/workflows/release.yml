name: Release

# Push a tag `vX.Y.Z` matching Cargo.toml to test it and publish a GitHub release with the
# CHANGELOG.md section as notes and the Python wheels attached. Dependents pin the tag (git
# dependency or sibling checkout). A tag with a pre-release suffix (vX.Y.Z-beta.N) is published as a
# pre-release. channels.yml then moves the stable / unstable branches.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tag matches Cargo.toml
        run: scripts/check-version.sh "${GITHUB_REF_NAME#v}"
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo test --no-default-features
      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          # a pre-release (vx.y.z-beta.n) needs no section of its own: fall back to [Unreleased]
          [[ -s notes.md || "$v" != *-* ]] || awk '/^## \[/{p = index($0, "[Unreleased]") > 0; next} p' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md

  wheels:
    name: wheels (${{ matrix.name }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64
          - name: macos-universal
            os: macos-latest
            target: universal2-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: "2_28"
          # midir links ALSA on Linux, btleplug (Bluetooth) links D-Bus
          before-script-linux: dnf install -y alsa-lib-devel dbus-devel
      - name: Smoke test
        shell: bash
        run: |
          pip install bindings/python/dist/*.whl
          python -c "import open_stomp; print(open_stomp.__version__, open_stomp.Module.AMP.models[8])"
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: bindings/python/dist/*.whl

  sdist:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: bindings/python/dist/*.tar.gz
