name: Release

# Push a tag `vX.Y.Z` matching Cargo.toml to test it, publish a GitHub release with the CHANGELOG.md
# section as notes and the Python wheels attached, and upload the wheels + sdist to PyPI (via
# Trusted Publishing — the `publish` job, gated on the `pypi` environment). Dependents pin the tag
# (git dependency or sibling checkout). A tag with a pre-release suffix (vX.Y.Z-beta.N) is published
# as a pre-release. channels.yml then moves the stable / unstable branches.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check tag matches Cargo.toml
        run: scripts/check-version.sh "${GITHUB_REF_NAME#v}"
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo test --no-default-features
      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          # a pre-release (vx.y.z-beta.n) needs no section of its own: fall back to [Unreleased]
          [[ -s notes.md || "$v" != *-* ]] || awk '/^## \[/{p = index($0, "[Unreleased]") > 0; next} p' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md

  wheels:
    name: wheels (${{ matrix.name }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64
          - name: macos-universal
            os: macos-latest
            target: universal2-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: "2_28"
          # midir links ALSA on Linux, btleplug (Bluetooth) links D-Bus
          before-script-linux: dnf install -y alsa-lib-devel dbus-devel
      - name: Smoke test
        shell: bash
        run: |
          pip install bindings/python/dist/*.whl
          python -c "import open_stomp; print(open_stomp.__version__, open_stomp.Module.AMP.models[8])"
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: bindings/python/dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: bindings/python/dist/*.whl

  sdist:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: bindings/python/dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: bindings/python/dist/*.tar.gz

  # Publish the built wheels + sdist to PyPI via Trusted Publishing (OIDC — no API token). The
  # `pypi` environment lets you require a manual approval before each upload (repo Settings →
  # Environments → pypi). Register the publisher on PyPI with: owner JackMechem, repo
  # open-stomp-lib, workflow release.yml, environment pypi.
  publish:
    name: publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/open-stomp-lib
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
